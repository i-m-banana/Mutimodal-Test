texts:
  - id: "aviation_safety"
    title: "航空安全规范"
    content: |
      1.乘员应在进入航空器前，接受安检并配合现场工作人员的引导。严禁携带易燃易爆、有毒、腐蚀性等危险品登机。

      2.登机后，请对号入座，并系好安全带。飞行过程中，须遵守"系好安全带"信号指示，未经允许不得离开座位。

      3.发现可疑人员或物品，应及时报告机组成员。不得传播虚假信息、制造恐慌。

      4.请勿携带或在机上使用禁止类电子设备，遵守所有安全广播和公告要求。
    
  - id: "funny_stories"
    title: "幽默小故事"
    content: |
      聪明的儿子：父亲对儿子说："这里是五步蛇，被它咬了走五步就死。""没关系，"儿子说，"万一被蛇咬了，我只走四步就不走了。"父亲赞许道："好聪明的儿子！不过，一步也不走才最保险。"
      
      "好"消息：作业做了很久，顺手打开收音机，一个温柔的声音传出："如果肤色粉红，脸上的绒毛细嫩柔软，那么说明很健康……"听到这里，我忍不住摸了自己的脸，对镜自照，感觉非常健康。这时播音员说道："好，听众朋友，这次我们的《养猪知识讲座》就到这里。"
  
  - id: "health_tips"
    title: "健康小贴士"
    content: |
      保持充足的睡眠对身体健康至关重要。成年人每天应保证7到8小时的睡眠时间。
      
      均衡饮食是健康的基础。多吃蔬菜水果，适量摄入蛋白质和碳水化合物，少吃油腻和高糖食品。
      
      每天坚持30分钟的有氧运动，如快走、慢跑或游泳，能够增强心肺功能。
      
      保持良好的心态，学会释放压力，多与朋友家人交流，有助于心理健康。
