# === 推理模型配置 ===
inference_models:
  # RGB疲劳度检测模型（基于视觉信号）
  - name: rgb_fatigue
    type: rgb_fatigue
    enabled: true
    integrated:
      class: models.rgb_fatigue_model.RGBFatigueModel
      options:
        device: auto  # auto, cuda, cpu
  
  # EEG疲劳度检测模型（基于脑电信号）
  # 注意：EEG疲劳度不再实时推理，已移至FatigueAssessmentService
  # 在SART测试结束后使用保存的EEG数据文件进行离线推理
  - name: eeg_fatigue
    type: eeg_fatigue
    enabled: false  # 禁用实时推理
    integrated:
      class: models.eeg_fatigue_model.EEGFatigueModel
      options:
        device: auto
  
  # 情绪识别模型
  - name: emotion
    type: emotion
    enabled: true
    integrated:
      class: models.emotion_v2_model.EmotionV2Model
      options:
        device: auto
  
  # 脑电分析模型（脑负荷）
  - name: eeg
    type: eeg
    enabled: true
    integrated:
      class: models.eeg_model.EEGModel
      options:
        device: auto  # EEG模型不使用GPU，但保持统一接口
